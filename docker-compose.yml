# Infrastructure:          docker compose up -d                          (make infra)
# + app processes:         docker compose --profile app up -d --build    (make up)
# + hot reload:            docker compose --profile app watch            (make watch)
# + tracing (Jaeger UI):   docker compose --profile observability up -d  (make up-obs)

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: backend_template:local
  restart: unless-stopped
  profiles:
    - app
  env_file:
    - .env
  # .env points to localhost for running on the host; inside compose services talk by name
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # [if redis]
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # [endif]
    # [if rabbitmq]
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    # [endif]
    # [if kafka]
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # [endif]
    # [if minio]
    MINIO_HOST: minio
    MINIO_PORT: "9000"
    # [endif]
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  depends_on:
    migrate:
      condition: service_completed_successfully
    # [if redis]
    redis:
      condition: service_healthy
    # [endif]
    # [if rabbitmq]
    rabbitmq:
      condition: service_healthy
    # [endif]
    # [if kafka]
    kafka:
      condition: service_healthy
    # [endif]
    # [if minio]
    minio:
      condition: service_healthy
    # [endif]
  networks:
    - network
  develop:
    watch:
      - action: sync+restart
        path: ./src
        target: /app/src
      - action: rebuild
        path: uv.lock

services:
  api:
    <<: *app
    command: ["granian", "--factory", "src.main:create_app"]
    ports:
      - "${APP_PORT:-8008}:8000"

  # [if messaging]
  consumer:
    <<: *app
    command: ["granian", "--factory", "src.entrypoints.consumer:create_consumer_app"]
  # [endif]

  scheduler:
    <<: *app
    # Exactly one process: every scheduler instance would run every worker
    command: ["granian", "--factory", "--workers", "1", "src.entrypoints.scheduler:create_scheduler_app"]
    ports:
      - "${SCHEDULER_PORT:-8009}:8000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRA_GROUP: "--group migrations"
    image: backend_template-migrate:local
    profiles:
      - app
      - migrate
    command: ["yoyo", "apply", "--batch", "--database", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}", "./migrations"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network

  db:
    image: postgres:16.2
    container_name: db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - network

  # [if redis]
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: redis
    restart: always
    ports:
      - "6378:6379"
      - "8001:8001"    # RedisInsight UI
    volumes:
      - redis_storage:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - network

  # [endif]
  # [if rabbitmq]
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"    # AMQP порт
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - network

  # [endif]
  # [if kafka]
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"  # внешний доступ с хоста
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - network

  # [endif]
  # [if minio]
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - network

  # [endif]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    profiles:
      - observability
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP/HTTP
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  # [if redis]
  redis_storage:
    driver: local
  # [endif]
  postgres_data:
    driver: local
  # [if rabbitmq]
  rabbitmq_data:
    driver: local
  # [endif]
  # [if kafka]
  kafka_data:
    driver: local
  # [endif]
  # [if minio]
  minio_data:
    driver: local
  # [endif]
