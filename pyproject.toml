[project]
name = "backend_template"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "fastapi>=0.116.1",
    "granian[uvloop]>=2.6.1",
    "pydantic-settings>=2.10.1",
    "asyncpg>=0.30.0",
    "orjson>=3.11.1",
    "yoyo-migrations>=9.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "aio-pika>=9.5.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "aiokafka>=0.14.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-asyncpg>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-aio-pika>=0.66b1",
    "opentelemetry-instrumentation-aiokafka>=0.66b1",
]

[dependency-groups]
dev = [
    "granian[reload, uvloop]>=2.6.1",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "jinja2>=3.1.6",
    "pika>=1.4.1",
    "pre-commit>=4.6.0",
    "psycopg2-binary>=2.9.12",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.3",
    "testcontainers>=4.14.2",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]
migrations = [
    "psycopg2-binary>=2.9.11",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "tools"]
# CLAUDE.md: no bare list / dict / tuple without type parameters
reportMissingTypeArgument = "error"

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
exclude = [
    "migrations/",
    "venv/",
    "__pycache__",
    ".git",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (ловит реальные баги)
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib (современный подход к путям)
    "RET",  # flake8-return (улучшает читаемость return)
    "RUF",  # Ruff-specific rules
    "PL",   # Pylint (базовые проверки качества)
    "G",    # flake8-logging-format: no f-strings / % / .format in log messages
    "T20",  # flake8-print: no print()
    "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",  # return type on every function and method
]

ignore = [
    "PLR0913",
    "PLR2004",
    "B008",
    "RUF003",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles must keep the signature of the callable they replace
"tests/**" = ["ARG001"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "tools"]
# CLAUDE.md: every module starts with it (I002, fixed automatically)
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (require running infrastructure)",
]
filterwarnings = [
    # third-party: testcontainers' own deprecated decorators, not our code
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

# ── Architecture: layer boundaries (make lint-arch) ──────────────────────────
[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure Python: no other layer, no framework or driver"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = [
    "src.api", "src.core", "src.entrypoints", "src.infrastructure", "src.interfaces", "src.main",
    "src.services", "src.workers",
    "fastapi", "starlette", "pydantic", "asyncpg", "redis", "aio_pika", "aiokafka", "minio",
]

[[tool.importlinter.contracts]]
name = "Interfaces know nothing about implementations, drivers or Config"
type = "forbidden"
source_modules = ["src.interfaces"]
forbidden_modules = [
    "src.api", "src.core.config", "src.core.container", "src.entrypoints", "src.infrastructure", "src.main",
    "src.services", "src.workers",
    "asyncpg", "redis", "aio_pika", "aiokafka", "minio",
]

[[tool.importlinter.contracts]]
name = "Services depend only on interfaces, domain and core — never on implementations or Config"
type = "forbidden"
source_modules = ["src.services"]
forbidden_modules = [
    "src.api", "src.core.config", "src.core.container", "src.entrypoints", "src.infrastructure", "src.main",
    "src.workers",
    "asyncpg", "redis", "aio_pika", "aiokafka", "minio",
]

[[tool.importlinter.contracts]]
name = "Workers call services through interfaces: no DB/cache/broker access, no Config"
type = "forbidden"
source_modules = ["src.workers"]
forbidden_modules = [
    "src.api", "src.core.config", "src.core.container", "src.entrypoints", "src.infrastructure", "src.main",
    "src.services",
    "asyncpg", "redis", "aio_pika", "aiokafka", "minio",
]

[[tool.importlinter.contracts]]
name = "Infrastructure (incl. message handlers) never imports upper layers or Config"
type = "forbidden"
source_modules = ["src.infrastructure"]
forbidden_modules = [
    "src.api", "src.core.config", "src.core.container", "src.entrypoints", "src.main", "src.services", "src.workers",
]

[[tool.importlinter.contracts]]
name = "API layer does not import implementations or drivers directly (only through the container)"
type = "forbidden"
source_modules = ["src.api"]
forbidden_modules = [
    "src.core.config", "src.entrypoints", "src.infrastructure", "src.main", "src.services", "src.workers",
    "asyncpg", "redis", "aio_pika", "aiokafka", "minio",
]
# api.dependencies reads the Container, which imports everything — only direct imports are checked
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Integration events are contracts: they depend only on core.events and domain"
type = "forbidden"
source_modules = ["src.events"]
forbidden_modules = [
    "src.api", "src.core.config", "src.core.container", "src.entrypoints", "src.infrastructure", "src.interfaces",
    "src.main", "src.services", "src.workers",
]

[[tool.importlinter.contracts]]
name = "Core building blocks (exceptions, logger, events, config) do not depend on application layers"
type = "forbidden"
source_modules = ["src.core.config", "src.core.events", "src.core.exceptions", "src.core.logger"]
forbidden_modules = [
    "src.api", "src.core.container", "src.entrypoints", "src.infrastructure", "src.main", "src.services",
    "src.workers",
]
