[project]
name = "backend_template"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "fastapi>=0.116.1",
    "granian[uvloop]>=2.6.1",
    "pydantic-settings>=2.10.1",
    "asyncpg>=0.30.0",
    "orjson>=3.11.1",
    "yoyo-migrations>=9.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "aio-pika>=9.5.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "aiokafka>=0.14.0",
]

[dependency-groups]
dev = [
    "granian[reload, uvloop]>=2.6.1",
    "httpx>=0.28.1",
    "pika>=1.4.1",
    "pre-commit>=4.6.0",
    "psycopg2-binary>=2.9.12",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.3",
    "testcontainers>=4.14.2",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]
migrations = [
    "psycopg2-binary>=2.9.11",
]

[tool.pyright]
  pythonVersion = "3.12"
  typeCheckingMode = "standard"
  include = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
exclude = [
    "migrations/",
    "venv/",
    "__pycache__",
    ".git",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (ловит реальные баги)
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib (современный подход к путям)
    "RET",  # flake8-return (улучшает читаемость return)
    "RUF",  # Ruff-specific rules
    "PL",   # Pylint (базовые проверки качества)
]

ignore = [
    "PLR0913",
    "PLR2004",
    "B008",
    "RUF003",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles must keep the signature of the callable they replace
"tests/**" = ["ARG001"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (require running infrastructure)",
]
